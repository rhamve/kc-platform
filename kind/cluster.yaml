# kind cluster for the Keycloak platform lab
# 1 control-plane + 2 workers; workers are labelled as two "zones" to simulate AZs
# Host ports 8880/8843 are used so they don't clash with the Docker Compose lab (8080, 8081, 4180)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kc-lab
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8880
        protocol: TCP
      - containerPort: 443
        hostPort: 8843
        protocol: TCP
  - role: worker
    labels:
      topology.kubernetes.io/zone: az-a
  - role: worker
    labels:
      topology.kubernetes.io/zone: az-b
