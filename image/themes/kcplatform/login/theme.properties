# Login theme for the kc-platform lab – extends Keycloak's default login theme (keycloak.v2).
# Parent's settings (stylesCommon = PatternFly, kc* CSS classes) are inherited.
parent=keycloak.v2
import=common/keycloak

# Keep the parent's stylesheet first, then ours so our rules win.
# css/styles.css is found in the parent theme; css/kcplatform.css is in this theme.
styles=css/styles.css css/kcplatform.css

# Light mode only – keeps the colour overrides simple (parent enables dark mode).
darkMode=true
