# Build the custom Keycloak image (multi-arch) and push it to GHCR
# - pull requests: build only (no push)
# - push to main:  build + push  ghcr.io/<owner>/<repo>/keycloak:<KC_VERSION>-<run>, :sha-<short>, :latest
name: keycloak-image

on:
  push:
    branches: [main]
    paths: ["image/**", ".github/workflows/keycloak-image.yml"]
  pull_request:
    paths: ["image/**", ".github/workflows/keycloak-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Keycloak version from Dockerfile
        run: echo "KC_VERSION=$(grep -m1 '^ARG KC_VERSION=' image/Dockerfile | cut -d= -f2)" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/keycloak
          tags: |
            type=raw,value=${{ env.KC_VERSION }}-${{ github.run_number }}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: image
          platforms: linux/amd64,linux/arm64
          build-args: KC_VERSION=${{ env.KC_VERSION }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
